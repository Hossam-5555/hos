<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="opening"><path d="M200,150 L280,190 L200,230 L120,190 Z"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="378" rx="104" ry="11" fill="#f1f3f3"/>

  <g transform="translate(0,40)" stroke="#a2a6aa" stroke-width="3">
    <!-- back flaps (open, leaning back) -->
    <path d="M120,190 L200,150 L212,108 L132,146 Z" fill="#f1f3f3"/>
    <path d="M200,150 L280,190 L290,150 L214,112 Z" fill="#e3e6e8"/>

    <!-- inside of box -->
    <path d="M200,150 L280,190 L200,230 L120,190 Z" fill="#c3cbce"/>
    <g clip-path="url(#opening)">
      <path d="M200,185 L290,230 L200,275 L110,230 Z" fill="#dde1e4" stroke="none"/>
      <path d="M120,190 L200,230" stroke="#a2a6aa"/>
    </g>
    <path d="M200,150 L280,190 L200,230 L120,190 Z"/>

    <!-- front faces -->
    <path d="M120,190 L200,230 L200,330 L120,290 Z" fill="#e3e6e8"/>
    <path d="M200,230 L280,190 L280,290 L200,330 Z" fill="#d7dbde"/>
    <!-- highlight -->
    <path d="M132,222 L132,274" stroke="#ffffff" stroke-width="5"/>

    <!-- front flaps (folded out) -->
    <path d="M120,190 L200,230 L194,250 L112,208 Z" fill="#f1f3f3"/>
    <path d="M200,230 L280,190 L288,208 L206,250 Z" fill="#e3e6e8"/>
  </g>

  <!-- floating document with X -->
  <g transform="translate(262,34) rotate(10)" stroke="#a2a6aa" stroke-width="3">
    <path d="M6,0 H44 L64,20 V78 Q64,84 58,84 H6 Q0,84 0,78 V6 Q0,0 6,0 Z" fill="#e3e6e8"/>
    <path d="M44,0 L64,20 H50 Q44,20 44,14 Z" fill="#c3cbce"/>
    <path d="M20,38 L44,62 M44,38 L20,62" stroke="#a2a6aa" stroke-width="9"/>
    <path d="M20,38 L44,62 M44,38 L20,62" stroke="#dde1e4" stroke-width="3.5"/>
  </g>

  <!-- small loose paper (left) -->
  <g transform="translate(46,118) rotate(-14)" stroke="#a2a6aa" stroke-width="3">
    <path d="M4,0 H52 Q56,0 56,4 V50 Q56,54 52,54 H4 Q0,54 0,50 V4 Q0,0 4,0 Z" fill="#f1f3f3"/>
    <path d="M12,14 H44 M12,24 H44 M12,34 H32" stroke-width="2.5"/>
  </g>

  <!-- small drifting bits -->
  <circle cx="352" cy="190" r="9" fill="#e3e6e8" stroke="#a2a6aa" stroke-width="3"/>
  <circle cx="70" cy="250" r="6" fill="#f1f3f3" stroke="#a2a6aa" stroke-width="3"/>
  <circle cx="330" cy="130" r="4" fill="#c3cbce" stroke="none"/>
  <path d="M96,330 l10,10 m0,-10 l-10,10" stroke="#c3cbce" stroke-width="3"/>
</svg>
